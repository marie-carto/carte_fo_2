<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/dept_simpl_0.js"></script>
        <script src="data/chef_lieu_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[42.23991394015294,-5.963747650274834],[50.33719519521274,11.622547599755572]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        function pop_dept_simpl_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="syndicat" colspan="2"><strong>syndicat</strong><br />' + (feature.properties['syndicat'] !== null ? autolinker.link(String(feature.properties['syndicat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">secretaire</th>\
                        <td class="visible-with-data" id="secretaire">' + (feature.properties['secretaire'] !== null ? autolinker.link(String(feature.properties['secretaire']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">mail</th>\
                        <td class="visible-with-data" id="mail">' + (feature.properties['mail'] !== null ? autolinker.link(String(feature.properties['mail']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">tel</th>\
                        <td class="visible-with-data" id="tel">' + (feature.properties['tel'] !== null ? autolinker.link(String(feature.properties['tel']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_dept_simpl_0_0() {
            return {
                pane: 'pane_dept_simpl_0',
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(227,26,28,0.5019607843137255)',
                interactive: true,
            }
        }
        map.createPane('pane_dept_simpl_0');
        map.getPane('pane_dept_simpl_0').style.zIndex = 400;
        map.getPane('pane_dept_simpl_0').style['mix-blend-mode'] = 'normal';
        var layer_dept_simpl_0 = new L.geoJson(json_dept_simpl_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_dept_simpl_0',
            layerName: 'layer_dept_simpl_0',
            pane: 'pane_dept_simpl_0',
            onEachFeature: pop_dept_simpl_0,
            style: style_dept_simpl_0_0,
        });
        bounds_group.addLayer(layer_dept_simpl_0);
        map.addLayer(layer_dept_simpl_0);
        function pop_chef_lieu_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['cleabs'] !== null ? autolinker.link(String(feature.properties['cleabs']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nom_offici'] !== null ? autolinker.link(String(feature.properties['nom_offici']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nom_offi_1'] !== null ? autolinker.link(String(feature.properties['nom_offi_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nom_du_che'] !== null ? autolinker.link(String(feature.properties['nom_du_che']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nom_du_c_1'] !== null ? autolinker.link(String(feature.properties['nom_du_c_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['code_insee'] !== null ? autolinker.link(String(feature.properties['code_insee']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['code_ins_1'] !== null ? autolinker.link(String(feature.properties['code_ins_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['code_siren'] !== null ? autolinker.link(String(feature.properties['code_siren']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['lien_vers_'] !== null ? autolinker.link(String(feature.properties['lien_vers_']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_chef_lieu_1_0() {
            return {
                pane: 'pane_chef_lieu_1',
                radius: 2.4,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,255,1.0)',
                interactive: false,
            }
        }
        map.createPane('pane_chef_lieu_1');
        map.getPane('pane_chef_lieu_1').style.zIndex = 401;
        map.getPane('pane_chef_lieu_1').style['mix-blend-mode'] = 'normal';
        var layer_chef_lieu_1 = new L.geoJson(json_chef_lieu_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_chef_lieu_1',
            layerName: 'layer_chef_lieu_1',
            pane: 'pane_chef_lieu_1',
            onEachFeature: pop_chef_lieu_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_chef_lieu_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_chef_lieu_1);
        map.addLayer(layer_chef_lieu_1);
        setBounds();
        var i = 0;
        layer_chef_lieu_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['nom_du_che'] !== null?String('<div style="color: #323232; font-size: 7pt; font-family: \'Yu Gothic UI\', sans-serif;">' + layer.feature.properties['nom_du_che']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_chef_lieu_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_dept_simpl_0,layer_chef_lieu_1]);
        map.on("zoomend", function(){
            resetLabels([layer_dept_simpl_0,layer_chef_lieu_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_dept_simpl_0,layer_chef_lieu_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_dept_simpl_0,layer_chef_lieu_1]);
        });
        </script>
    </body>
</html>
